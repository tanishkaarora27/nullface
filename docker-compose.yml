services:
  api:
    build: { context: ., dockerfile: backend/Dockerfile, args: { FULL: "0" } }   # FULL=1 pulls torch/InsightFace/ViT/Wav2Vec2
    ports: ["8000:8000"]
    env_file: [backend/.env]
    environment:
      DATABASE_URL: postgresql://nullface:nullface@postgres:5432/nullface
      REDIS_URL: redis://redis:6379/0
      NF_CHROMA_DIR: /srv/chroma
    shm_size: "1gb"                       # /dev/shm ephemeral RAM buffer
    volumes: ["chroma:/srv/chroma"]
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: nullface, POSTGRES_PASSWORD: nullface, POSTGRES_DB: nullface }
    volumes: ["pgdata:/var/lib/postgresql/data", "./deploy/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro"]
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]
volumes: { pgdata: {}, chroma: {} }
